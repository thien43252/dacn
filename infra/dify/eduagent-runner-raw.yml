# eduagent-runner-raw: giống eduagent-runner nhưng TẮT kiểm duyệt; chỉ cho kiểm định (contracts/dify-apps.md mục 3).
# Sinh từ moderation-keywords.txt + preset-responses.json. Cần: plugin langgenius/agent, MCP server
# Server Identifier "eduagent-tools" (Tools → MCP). Model mặc định gpt-4o-mini (OpenAI plugin).
app:
  name: eduagent-runner-raw
  description: Bản không kiểm duyệt của eduagent-runner, chỉ cho kiểm định.
  icon: 🧪
  icon_background: '#FEF3C7'
  mode: advanced-chat
  use_icon_as_answer_icon: false
dependencies:
- type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:1.1.0
- type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/agent:0.0.51@3c6c32e593b33476cb52f4e5aaf1bf23e1c71b3d07ba64d40690e0dbce3a7e34
kind: app
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-source-agent-target
      source: start
      sourceHandle: source
      target: agent
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: agent
    - id: agent-source-answer-target
      source: agent
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        isInIteration: false
        isInLoop: false
        sourceType: agent
        targetType: answer
    nodes:
    - id: start
      type: custom
      data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - variable: system_prompt
          label: system_prompt
          type: paragraph
          required: true
          max_length: 12000
          options: []
        - variable: ctx
          label: ctx
          type: text-input
          required: true
          max_length: 128
          options: []
        - variable: safety_note
          label: safety_note
          type: select
          required: false
          default: 'false'
          options:
          - 'true'
          - 'false'
      position:
        x: 30
        y: 280
      positionAbsolute:
        x: 30
        y: 280
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 90
    - id: agent
      type: custom
      data:
        desc: ''
        selected: false
        title: Agent
        type: agent
        agent_strategy_provider_name: langgenius/agent/agent
        agent_strategy_name: function_calling
        agent_strategy_label: FunctionCalling
        plugin_unique_identifier: langgenius/agent:0.0.51@3c6c32e593b33476cb52f4e5aaf1bf23e1c71b3d07ba64d40690e0dbce3a7e34
        tool_node_version: '2'
        memory:
          window:
            enabled: true
            size: 12
          query_prompt_template: '{{#sys.query#}}'
        agent_parameters:
          model:
            type: constant
            value:
              provider: langgenius/openai/openai
              model: gpt-4o-mini
              model_type: llm
              mode: chat
              type: model-selector
              completion_params:
                temperature: 0.3
          tools:
            type: constant
            value:
            - enabled: true
              type: mcp
              provider_name: eduagent-tools
              provider_show_name: eduagent-tools
              tool_name: class_doc_search
              tool_label: class_doc_search
              tool_description: Tìm các đoạn liên quan trong tài liệu giáo viên đã tải lên lớp.
              parameters:
                ctx:
                  auto: 0
                  value:
                    type: variable
                    value:
                    - start
                    - ctx
                query:
                  auto: 1
                  value: null
                top_k:
                  auto: 1
                  value: null
              settings: {}
              extra:
                description: Tìm các đoạn liên quan trong tài liệu giáo viên đã tải lên lớp.
            - enabled: true
              type: mcp
              provider_name: eduagent-tools
              provider_show_name: eduagent-tools
              tool_name: quiz_generator
              tool_label: quiz_generator
              tool_description: Soạn câu hỏi trắc nghiệm hoặc tự luận theo chủ đề, bám tài liệu lớp.
              parameters:
                ctx:
                  auto: 0
                  value:
                    type: variable
                    value:
                    - start
                    - ctx
                topic:
                  auto: 1
                  value: null
                num_questions:
                  auto: 1
                  value: null
                question_type:
                  auto: 1
                  value: null
                level:
                  auto: 1
                  value: null
                with_answers:
                  auto: 1
                  value: null
              settings: {}
              extra:
                description: Soạn câu hỏi trắc nghiệm hoặc tự luận theo chủ đề, bám tài liệu lớp.
            - enabled: true
              type: mcp
              provider_name: eduagent-tools
              provider_show_name: eduagent-tools
              tool_name: rubric_grader
              tool_label: rubric_grader
              tool_description: Chấm hoặc nhận xét bài văn theo rubric.
              parameters:
                ctx:
                  auto: 0
                  value:
                    type: variable
                    value:
                    - start
                    - ctx
                essay:
                  auto: 1
                  value: null
                rubric:
                  auto: 1
                  value: null
                assignment:
                  auto: 1
                  value: null
              settings: {}
              extra:
                description: Chấm hoặc nhận xét bài văn theo rubric.
            - enabled: true
              type: mcp
              provider_name: eduagent-tools
              provider_show_name: eduagent-tools
              tool_name: math_check
              tool_label: math_check
              tool_description: Giải, rút gọn hoặc kiểm tra kết quả toán bằng tính toán ký hiệu (sympy).
              parameters:
                ctx:
                  auto: 0
                  value:
                    type: variable
                    value:
                    - start
                    - ctx
                operation:
                  auto: 1
                  value: null
                expression:
                  auto: 1
                  value: null
                answer:
                  auto: 1
                  value: null
                variable:
                  auto: 1
                  value: null
              settings: {}
              extra:
                description: Giải, rút gọn hoặc kiểm tra kết quả toán bằng tính toán ký hiệu (sympy).
            - enabled: true
              type: mcp
              provider_name: eduagent-tools
              provider_show_name: eduagent-tools
              tool_name: progress_summary
              tool_label: progress_summary
              tool_description: Tổng hợp tình hình học tập của con hoặc học sinh trong lớp, không trích nguyên văn tin nhắn.
              parameters:
                ctx:
                  auto: 0
                  value:
                    type: variable
                    value:
                    - start
                    - ctx
                student_name:
                  auto: 1
                  value: null
                days:
                  auto: 1
                  value: null
              settings: {}
              extra:
                description: Tổng hợp tình hình học tập của con hoặc học sinh trong lớp, không trích nguyên văn tin nhắn.
          instruction:
            type: constant
            value: '{{#start.system_prompt#}}


              Ghi chú an toàn của lượt này: {{#start.safety_note#}}. Nếu là true, người dùng có dấu hiệu buồn bã hoặc nguy
              cơ tự hại: trả lời ân cần, không phán xét, khuyến khích nói ngay với bố mẹ, thầy cô hoặc người lớn tin cậy và
              nhắc Tổng đài quốc gia bảo vệ trẻ em 111 (miễn phí, 24/7); không đi tiếp nội dung bài học nếu chưa hỏi thăm.

              Tham số ctx của mọi công cụ do nền tảng điền sẵn; không nhắc tới nó.'
          query:
            type: constant
            value: '{{#sys.query#}}'
          maximum_iterations:
            type: constant
            value: 5
      position:
        x: 330
        y: 280
      positionAbsolute:
        x: 330
        y: 280
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 90
    - id: answer
      type: custom
      data:
        desc: ''
        selected: false
        title: Answer
        type: answer
        answer: '{{#agent.text#}}'
        variables: []
      position:
        x: 630
        y: 280
      positionAbsolute:
        x: 630
        y: 280
      sourcePosition: right
      targetPosition: left
      width: 244
      height: 90
    viewport:
      x: 0
      y: 0
      zoom: 0.8
