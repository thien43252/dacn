name: eduagent-prod

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: eduagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduagent -d eduagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://eduagent:${POSTGRES_PASSWORD}@postgres:5432/eduagent
      APP_ENV: production
      COOKIE_SECURE: "true"
      ALLOWED_ORIGINS: '["https://${SITE_ADDRESS}"]'
    volumes:
      - uploads:/app/backend/data/uploads

  web:
    build:
      context: ../..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
