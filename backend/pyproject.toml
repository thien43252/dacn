[project]
name = "eduagent-hub-backend"
version = "0.1.0"
description = "Backend for EduAgent Hub: classes, agent hub, multi-agent runtime with guardrails and certification."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "langgraph>=1.2.17",
    "anthropic>=2.3.0",
    "openai>=3.37.0",
    "google-genai>=2.33.0",
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "mcp>=2.3.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: runs the eval scripts as subprocesses (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# The formatter keeps code at 120 columns; long Vietnamese prompt and message strings stay unbroken on purpose.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]
